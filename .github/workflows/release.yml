name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_pages:
        description: "Publish apt repo to GitHub Pages"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gzip xz-utils gnupg

      - name: Build .deb
        run: |
          chmod +x packaging/build-deb.sh packaging/build-apt-repo.sh
          ./packaging/build-deb.sh

      - name: Build apt repository
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          PORTLOCK_APT_FINGERPRINT: ${{ secrets.PORTLOCK_APT_FINGERPRINT }}
        run: |
          ./packaging/build-apt-repo.sh
          # User-facing installer at site root
          cp packaging/install-apt.sh packaging/apt-repo/install-apt.sh
          chmod 755 packaging/apt-repo/install-apt.sh

      - name: Upload release assets (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/gtdataworks-portlock_*.deb
          generate_release_notes: true
          fail_on_unmatched_files: false

      # Site source is the gh-pages branch (legacy GitHub Pages).
      # Publish the signed static apt repo there so KEY.gpg + InRelease ship.
      - name: Publish apt repo to gh-pages
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_pages) || startsWith(github.ref, 'refs/tags/') }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: packaging/apt-repo
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
